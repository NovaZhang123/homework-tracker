<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语启蒙作业追踪器</title>
<style>
:root {
  --bg: #f8f4f0;
  --card: #ffffff;
  --primary: #5B8DEF;
  --primary-light: #e8f0fe;
  --success: #34A853;
  --success-light: #e6f4ea;
  --warning: #FBBC04;
  --text: #2d2d2d;
  --text-secondary: #5f6368;
  --border: #e8e4e0;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 16px;
  --radius-sm: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 60px;
}
.app { max-width: 720px; margin: 0 auto; padding: 16px; }

/* Header */
.header {
  text-align: center;
  padding: 24px 16px 16px;
}
.header h1 { font-size: 24px; font-weight: 700; color: var(--primary); }
.header .subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

/* Class Tabs */
.class-tabs {
  display: flex; gap: 8px; margin-bottom: 16px;
  background: var(--card); border-radius: var(--radius);
  padding: 4px; box-shadow: var(--shadow);
}
.class-tab {
  flex: 1; padding: 10px 8px; border: none; cursor: pointer;
  border-radius: 12px; font-size: 15px; font-weight: 600;
  background: transparent; color: var(--text-secondary);
  transition: all 0.2s;
}
.class-tab:hover { background: var(--primary-light); color: var(--primary); }
.class-tab.active { background: var(--primary); color: #fff; }

/* Week Selector */
.week-selector {
  display: flex; align-items: center; justify-content: center;
  gap: 12px; margin-bottom: 16px; padding: 12px 16px;
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.week-btn {
  width: 36px; height: 36px; border: 2px solid var(--border);
  border-radius: 10px; background: var(--card); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--text-secondary); transition: all 0.2s;
}
.week-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
.week-btn:active { transform: scale(0.95); }
.week-info {
  text-align: center; min-width: 200px;
}
.week-label { font-size: 18px; font-weight: 700; }
.week-range { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.today-btn {
  font-size: 12px; color: var(--primary); cursor: pointer;
  border: none; background: none; text-decoration: underline;
  margin-top: 2px;
}

/* Session Cards */
.sessions { display: flex; flex-direction: column; gap: 16px; }

.session-card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
}
.session-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid var(--border);
}
.session-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 15px; font-weight: 600;
}
.session-type {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
}
.session-type.new { background: #e8f0fe; color: #5B8DEF; }
.session-type.review { background: #fef2e0; color: #E08B2A; }
.session-date { font-size: 13px; color: var(--text-secondary); }
.session-delete {
  width: 28px; height: 28px; border: none; background: transparent;
  cursor: pointer; font-size: 16px; color: #ccc; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.session-delete:hover { color: #EA4335; background: #fce8e6; }

/* Student Table - Vertical layout */
.student-list {
  padding: 8px 12px;
}
.student-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border-radius: var(--radius-sm);
  cursor: pointer; user-select: none;
  transition: background 0.15s; -webkit-tap-highlight-color: transparent;
  margin: 2px 0;
}
.student-row:active { transform: scale(0.98); }
.student-row:hover { background: #f8f9fa; }
.student-row.done { background: var(--success-light); }
.student-row.pending { background: transparent; }
.student-info {
  display: flex; flex-direction: column; gap: 1px;
}
.student-info .cn { font-size: 14px; font-weight: 600; color: var(--text); }
.student-info .en { font-size: 11px; color: var(--text-secondary); font-weight: 400; }
.student-status {
  display: flex; align-items: center; gap: 6px;
  font-size: 20px; min-width: 32px; justify-content: flex-end;
}
.student-status .check-icon {
  width: 34px; height: 34px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.student-row.done .check-icon { background: #c8e6c9; }
.student-row.pending .check-icon { background: #f1f3f4; opacity: 0.5; }

/* Add Session Placeholder */
.add-session {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; padding: 20px;
  background: var(--card); border: 2px dashed var(--border);
  border-radius: var(--radius); cursor: pointer;
  color: var(--text-secondary); font-size: 14px;
  transition: all 0.2s;
}
.add-session:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

/* Stats Bar */
.stats-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 18px; margin-top: 16px;
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.stats-text { font-size: 14px; font-weight: 500; }
.stats-text span { color: var(--success); font-weight: 700; }
.download-btn {
  padding: 8px 18px; border: none; border-radius: 20px;
  background: var(--primary); color: #fff; font-size: 13px;
  font-weight: 600; cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; gap: 4px;
}
.download-btn:hover { background: #4A7DE0; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(91,141,239,0.3); }
.download-btn:active { transform: scale(0.97); }

/* Loading Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  padding: 12px 24px; background: #333; color: #fff; border-radius: 24px;
  font-size: 14px; z-index: 999; opacity: 0; transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* Card Preview (hidden, for export) */
.card-preview {
  position: fixed; left: -9999px; top: 0;
  width: 440px; padding: 28px; background: #fff;
  border-radius: 20px; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
.card-preview .card-header {
  text-align: center; margin-bottom: 8px;
}
.card-preview .card-title {
  font-size: 22px; font-weight: 700; color: #5B8DEF;
}
.card-preview .card-week {
  font-size: 13px; color: #5f6368; margin-top: 4px;
}
.card-preview .hw-badge {
  display: inline-block; padding: 3px 14px; border-radius: 12px;
  background: #fce4ec; color: #E91E63; font-size: 13px; font-weight: 700;
  margin-bottom: 12px;
}
.card-preview .card-divider {
  height: 3px; background: linear-gradient(90deg, #5B8DEF, #34A853, #FBBC04);
  border-radius: 2px; margin-bottom: 16px;
}
.card-preview .session-block {
  margin-bottom: 14px;
}
.card-preview .session-title-row {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  margin-bottom: 8px; font-size: 13px; font-weight: 700;
}
.card-preview .session-meta {
  display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
  font-size: 12px; color: #5f6368;
}
.card-preview .deadline-badge {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700;
}
.card-preview .deadline-badge.urgent { background: #fce8e6; color: #EA4335; }
.card-preview .deadline-badge.soon { background: #fef2e0; color: #E08B2A; }
.card-preview .deadline-badge.plenty { background: #e6f4ea; color: #34A853; }
.card-preview .card-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; margin-bottom: 6px;
  border-radius: 10px; font-size: 14px; font-weight: 500;
}
.card-preview .card-item.done { background: #e6f4ea; }
.card-preview .card-item.pending { background: #f5f5f5; }
.card-preview .card-item .student-name { font-size: 15px; }
.card-preview .card-item .right-side {
  display: flex; align-items: center; gap: 6px;
}
.card-preview .card-item .status-icon { font-size: 18px; }
.card-preview .card-item .encourage {
  font-size: 12px; font-weight: 700; min-width: 56px; text-align: right;
}
.card-preview .card-item.done .encourage { color: #34A853; }
.card-preview .card-item.pending .encourage { color: #999; }
.card-preview .card-footer {
  text-align: center; margin-top: 16px; padding-top: 14px;
  border-top: 1px solid #e8e4e0; font-size: 13px; color: #5f6368;
  line-height: 1.8;
}

/* Responsive */
@media (max-width: 480px) {
  .app { padding: 8px; }
  .header { padding: 16px 8px; }
  .header h1 { font-size: 20px; }
  .class-tab { font-size: 13px; padding: 8px 4px; }
  .week-selector { padding: 10px; gap: 8px; }
  .session-header { padding: 10px 14px; }
  .student-row { padding: 10px 8px; }
  .student-info .cn { font-size: 13px; }
  .stats-bar { flex-direction: column; gap: 12px; text-align: center; }
  .card-preview { width: 320px; padding: 20px; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div class="card-preview" id="cardPreview"></div>

<script>
// ========== DATA MODEL ==========
const STORAGE_KEY = 'homework_tracker';

const DEFAULT_DATA = {
  version: 1,
  classes: {
    "1": {
      name: "1班",
      schedule: { new: 0, review: 5 }, // new=Sun review=Fri
      students: [
        { cn: "董彭芃", en: "Mark" },    // index 0
        { cn: "彭恰恰", en: "Mike" },    // index 1
        { cn: "郭知瑶", en: "Lumi" },    // index 2
        { cn: "王娜", en: "Emma" },      // index 3
        { cn: "李明泽", en: "Yolanda" }, // index 4
        { cn: "刘翼梦", en: "Iris" }     // index 5
      ]
    },
    "2": {
      name: "2班",
      schedule: { new: 2, review: 6 }, // new=Tue review=Sat
      students: [
        { cn: "赵千祎", en: "Anna" },
        { cn: "孙晓霖", en: "Amy" },
        { cn: "徐提珈", en: "Lucas" },
        { cn: "陈宗楷", en: "Alex" },
        { cn: "陈熙", en: "Ada" },
        { cn: "尹续菲", en: "Molly" }
      ]
    },
    "6": {
      name: "6班",
      schedule: { new: 6, review: 3 }, // new=Sat review=Wed
      students: [
        { cn: "王俊朔", en: "Edward" },
        { cn: "李艺明", en: "Eva" },
        { cn: "张宸滋", en: "Daisy" },
        { cn: "张毓君", en: "Hannah" },
        { cn: "杨栩", en: "Willian" },
        { cn: "刘敬斌", en: "Daniel" },
        { cn: "陈文楷", en: "Leo" },
        { cn: "田俊杰", en: "Matt" },
        { cn: "朱昱颖", en: "Luna" },
        { cn: "刘秋昀", en: "Samson" }
      ]
    }
  },
  records: {}  // key: "classId-weekKey-type" -> { date, submissions: { studentIndex: bool } }
};

const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];
const WEEKDAYS_SHORT = ['日','一','二','三','四','五','六'];
const TYPE_NAMES = { new: '新课', review: '复习课' };
const TYPE_ICONS = { new: '📘', review: '📗' };

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_DATA));
    const data = JSON.parse(raw);
    if (!data.version || !data.classes || !data.records) return JSON.parse(JSON.stringify(DEFAULT_DATA));
    // Merge student list from defaults so name changes take effect
    for (const [cid, defCls] of Object.entries(DEFAULT_DATA.classes)) {
      if (data.classes[cid]) {
        data.classes[cid].students = JSON.parse(JSON.stringify(defCls.students));
        data.classes[cid].schedule = defCls.schedule;
      }
    }
    return data;
  } catch (e) {
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let data = loadData();

// ========== WEEK UTILS ==========
function getMondayOfISOWeek(weekNum, year) {
  const jan4 = new Date(year, 0, 4);
  const jan4Day = jan4.getDay() || 7;
  const firstMonday = new Date(jan4);
  firstMonday.setDate(jan4.getDate() - (jan4Day - 1));
  const monday = new Date(firstMonday);
  monday.setDate(firstMonday.getDate() + (weekNum - 1) * 7);
  return monday;
}

function getISOWeekKey(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const week1 = new Date(d.getFullYear(), 0, 4);
  const weekNum = 1 + Math.round(((d.getTime() - week1.getTime()) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
  return d.getFullYear() + '-W' + String(weekNum).padStart(2, '0');
}

function getISOWeekRange(weekKey) {
  const [y, w] = weekKey.split('-W').map(Number);
  const mon = getMondayOfISOWeek(w, y);
  const sun = new Date(mon);
  sun.setDate(mon.getDate() + 6);
  const fmt = d => `${d.getMonth() + 1}.${d.getDate()}`;
  return { mon, sun, label: `${y}年 第${w}周 (${fmt(mon)} - ${fmt(sun)})` };
}

function getScheduleDate(weekKey, dayOfWeek) {
  // dayOfWeek: 0=Sun, 1=Mon, ..., 6=Sat (JS getDay convention)
  const [y, w] = weekKey.split('-W').map(Number);
  const mon = getMondayOfISOWeek(w, y);
  const target = new Date(mon);
  // Mon is day 1 in ISO week. Convert JS dayOfWeek to offset from Mon:
  // JS: 0=Sun→6, 1=Mon→0, 2=Tue→1, 3=Wed→2, 4=Thu→3, 5=Fri→4, 6=Sat→5
  const offset = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
  target.setDate(mon.getDate() + offset);
  return target;
}

function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function getDeadlineDate(weekKey, classId, type) {
  const cls = data.classes[classId];
  const lessonDate = getScheduleDate(weekKey, cls.schedule[type]);

  // Which is the "other" class type?
  const otherType = type === 'new' ? 'review' : 'new';
  const sameWeekOther = getScheduleDate(weekKey, cls.schedule[otherType]);

  // If the other class is later this same week, use it
  if (sameWeekOther > lessonDate) {
    return sameWeekOther;
  }

  // Otherwise, use next week's other class
  const [y, w] = weekKey.split('-W').map(Number);
  const mon = getMondayOfISOWeek(w, y);
  mon.setDate(mon.getDate() + 7);
  return getScheduleDate(getISOWeekKey(mon), cls.schedule[otherType]);
}

function getDaysUntilDeadline(weekKey, classId, type) {
  const deadline = getDeadlineDate(weekKey, classId, type);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const d = new Date(deadline);
  d.setHours(0, 0, 0, 0);
  return Math.ceil((d.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
}

function fmtDate(dateStr) {
  const [y, m, d] = dateStr.split('-');
  return `${+m}月${+d}日`;
}

// ========== RECORD UTILS ==========
function recordKey(classId, weekKey, type) {
  return `${classId}-${weekKey}-${type}`;
}

function getRecord(classId, weekKey, type) {
  const key = recordKey(classId, weekKey, type);
  return data.records[key] || null;
}

function ensureRecord(classId, weekKey, type) {
  const key = recordKey(classId, weekKey, type);
  if (!data.records[key]) {
    const schedule = data.classes[classId].schedule;
    const d = getScheduleDate(weekKey, schedule[type]);
    const students = data.classes[classId].students;
    const submissions = {};
    students.forEach((_, i) => { submissions[i] = false; });
    data.records[key] = { date: dateKey(d), type, classId, weekKey, submissions };
    saveData(data);
  }
  return data.records[key];
}

function deleteRecord(classId, weekKey, type) {
  const key = recordKey(classId, weekKey, type);
  delete data.records[key];
  saveData(data);
}

function toggleSubmission(classId, weekKey, type, studentIndex) {
  const record = ensureRecord(classId, weekKey, type);
  record.submissions[studentIndex] = !record.submissions[studentIndex];
  saveData(data);
}

// ========== STATE ==========
let currentClass = '1';
let currentWeek = getISOWeekKey(new Date());

// ========== RENDER ==========
function render() {
  const cls = data.classes[currentClass];
  const range = getISOWeekRange(currentWeek);
  const todayWeek = getISOWeekKey(new Date());

  const newRecord = getRecord(currentClass, currentWeek, 'new');
  const reviewRecord = getRecord(currentClass, currentWeek, 'review');

  const hasNew = newRecord !== null;
  const hasReview = reviewRecord !== null;

  let sessionsHTML = '';

  // New lesson session
  if (hasNew) {
    sessionsHTML += renderSession(cls, currentWeek, newRecord, 'new');
  } else {
    const newDate = getScheduleDate(currentWeek, cls.schedule.new);
    sessionsHTML += renderAddButton('new', newDate);
  }

  // Review lesson session
  if (hasReview) {
    sessionsHTML += renderSession(cls, currentWeek, reviewRecord, 'review');
  } else {
    const reviewDate = getScheduleDate(currentWeek, cls.schedule.review);
    sessionsHTML += renderAddButton('review', reviewDate);
  }

  // Stats
  let total = 0, done = 0;
  [newRecord, reviewRecord].forEach(rec => {
    if (!rec) return;
    Object.values(rec.submissions).forEach(v => {
      total++;
      if (v) done++;
    });
  });
  const hasAnyRecords = hasNew || hasReview;

  const html = `
    <div class="header">
      <h1>📝 英语启蒙作业追踪器</h1>
      <div class="subtitle">复述视频 · 作业提交追踪</div>
    </div>

    <div class="class-tabs">
      ${Object.entries(data.classes).map(([id, c]) =>
        `<button class="class-tab${id === currentClass ? ' active' : ''}"
          onclick="switchClass('${id}')">${c.name}</button>`
      ).join('')}
    </div>

    <div class="week-selector">
      <button class="week-btn" onclick="prevWeek()">◀</button>
      <div class="week-info">
        <div class="week-label">${range.label.split('(')[0]}</div>
        <div class="week-range">${range.label.split('(')[1]?.replace(')','') || ''}</div>
        ${currentWeek !== todayWeek ? `<button class="today-btn" onclick="goToday()">回到本周</button>` : ''}
      </div>
      <button class="week-btn" onclick="nextWeek()">▶</button>
    </div>

    <div class="sessions">
      ${sessionsHTML}
    </div>

    ${hasAnyRecords ? `
      <div class="stats-bar">
        <div class="stats-text">
          📊 本周进度：<span>${done}/${total}</span> 已交
          ${total > 0 ? ` (${Math.round(done/total*100)}%)` : ''}
        </div>
        <button class="download-btn" onclick="downloadCard()">
          📥 下载卡片
        </button>
      </div>
    ` : `
      <div style="text-align:center;padding:40px 16px;color:var(--text-secondary)">
        <div style="font-size:48px;margin-bottom:12px">📋</div>
        <div style="font-size:15px">点击上方课程按钮开始记录</div>
      </div>
    `}
  `;

  document.getElementById('app').innerHTML = html;
}

function renderSession(cls, weekKey, record, type) {
  const typeName = TYPE_NAMES[type];
  const typeIcon = TYPE_ICONS[type];
  const dateStr = record.date;
  const [y, m, d] = dateStr.split('-');
  const dayOfWeek = WEEKDAYS[new Date(+y, +m - 1, +d).getDay()];

  const daysLeft = getDaysUntilDeadline(currentWeek, currentClass, type);
  let deadlineHTML = '';
  if (daysLeft >= 0) {
    const dlClass = daysLeft <= 1 ? 'urgent' : daysLeft <= 3 ? 'soon' : 'plenty';
    deadlineHTML = `<span class="deadline-badge ${dlClass}" style="display:inline-flex;align-items:center;gap:2px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;${daysLeft<=1?'background:#fce8e6;color:#EA4335':daysLeft<=3?'background:#fef2e0;color:#E08B2A':'background:#e6f4ea;color:#34A853'}">⏰ 剩${daysLeft}天</span>`;
  }

  const headerHTML = `
    <div class="session-header">
      <div class="session-title">
        <span>📅 ${m}月${d}日 ${dayOfWeek}</span>
        <span class="session-type ${type}">${typeIcon} ${typeName}</span>
        ${deadlineHTML}
      </div>
      <button class="session-delete" onclick="handleDelete('${currentClass}','${currentWeek}','${type}')"
        title="删除此记录">✕</button>
    </div>
  `;

  const listHTML = cls.students.map((s, i) => {
    const submitted = record.submissions[i] || false;
    return `
      <div class="student-row ${submitted ? 'done' : 'pending'}"
           onclick="handleToggle('${currentClass}','${currentWeek}','${type}',${i})">
        <div class="student-info">
          <span class="cn">${s.cn}${s.en ? ' <span class="en">' + s.en + '</span>' : ''}</span>
        </div>
        <div class="student-status">
          <span class="check-icon">${submitted ? '✅' : '⬜'}</span>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="session-card">
      ${headerHTML}
      <div class="student-list">
        ${listHTML}
      </div>
    </div>
  `;
}

function renderAddButton(type, date) {
  const typeName = TYPE_NAMES[type];
  const typeIcon = TYPE_ICONS[type];
  const dayOfWeek = WEEKDAYS[date.getDay()];
  const dateLabel = `${date.getMonth()+1}月${date.getDate()}日 ${dayOfWeek}`;

  return `
    <div class="add-session" onclick="handleAdd('${currentClass}','${currentWeek}','${type}')">
      <span>+ 添加课程</span>
      <span style="font-size:12px;opacity:0.7">${typeIcon} ${typeName} · ${dateLabel}</span>
    </div>
  `;
}

// ========== ACTIONS ==========
function switchClass(id) {
  currentClass = id;
  render();
}

function prevWeek() {
  const [y, w] = currentWeek.split('-W').map(Number);
  const mon = getMondayOfISOWeek(w, y);
  mon.setDate(mon.getDate() - 7);
  currentWeek = getISOWeekKey(mon);
  render();
}

function nextWeek() {
  const [y, w] = currentWeek.split('-W').map(Number);
  const mon = getMondayOfISOWeek(w, y);
  mon.setDate(mon.getDate() + 7);
  currentWeek = getISOWeekKey(mon);
  render();
}

function goToday() {
  currentWeek = getISOWeekKey(new Date());
  render();
}

function handleAdd(classId, weekKey, type) {
  ensureRecord(classId, weekKey, type);
  render();
}

function handleDelete(classId, weekKey, type) {
  if (!confirm(`确定删除 ${TYPE_NAMES[type]} 的记录吗？`)) return;
  deleteRecord(classId, weekKey, type);
  render();
}

function handleToggle(classId, weekKey, type, studentIndex) {
  toggleSubmission(classId, weekKey, type, studentIndex);
  render();
}

// ========== CARD DOWNLOAD ==========
async function downloadCard() {
  const cls = data.classes[currentClass];
  const range = getISOWeekRange(currentWeek);
  const newRecord = getRecord(currentClass, currentWeek, 'new');
  const reviewRecord = getRecord(currentClass, currentWeek, 'review');

  const encourageTexts = [
    '太厉害了🌟', '超级棒👏', '完成啦✨', '好样的🎯', '真不错💪',
    '小天才⭐', '非常优秀🏆', '完美👍', '赞赞赞🎉'
  ];

  let blocksHTML = '';

  function renderSessionBlock(record, type) {
    if (!record) return '';
    const typeName = TYPE_NAMES[type];
    const typeIcon = TYPE_ICONS[type];
    const typeColor = type === 'new' ? '#5B8DEF' : '#E08B2A';
    const daysLeft = getDaysUntilDeadline(currentWeek, currentClass, type);
    const dlClass = daysLeft <= 1 ? 'urgent' : daysLeft <= 3 ? 'soon' : 'plenty';
    const dlText = daysLeft >= 0
      ? (daysLeft === 0 ? '今天截止!' : `还剩 ${daysLeft} 天`)
      : '还剩 0 天';

    const items = cls.students.map((s, i) => {
      const done = record.submissions[i] || false;
      const enc = done ? encourageTexts[i % encourageTexts.length] : '加油哦~';
      return `<div class="card-item ${done ? 'done' : 'pending'}">
        <span class="student-name">${s.cn}${s.en ? ' ' + s.en : ''}</span>
        <span class="right-side">
          <span class="encourage">${done ? enc : '⏳ 加油哦~'}</span>
          <span class="status-icon">${done ? '✅' : '⬜'}</span>
        </span>
      </div>`;
    }).join('');

    return `
      <div class="session-block">
        <div class="session-title-row" style="color:${typeColor}">${typeIcon} ${typeName} · ${fmtDate(record.date)}</div>
        <div class="session-meta">
          <span>📌 发布: ${fmtDate(record.date)}</span>
          <span class="deadline-badge ${dlClass}">⏰ 截止: ${dlText}</span>
        </div>
        ${items}
      </div>
    `;
  }

  blocksHTML += renderSessionBlock(newRecord, 'new');
  blocksHTML += renderSessionBlock(reviewRecord, 'review');

  // Stats
  let total = 0, done = 0;
  [newRecord, reviewRecord].forEach(rec => {
    if (!rec) return;
    Object.values(rec.submissions).forEach(v => { total++; if (v) done++; });
  });
  const pct = total > 0 ? Math.round(done / total * 100) : 0;

  let footerHTML;
  if (pct === 100) {
    footerHTML = `🎉🎉 全部完成！${cls.name} 太棒了！🏆<br><span style="font-size:11px;color:#999">每个小朋友都是复述小达人 ✨</span>`;
  } else if (pct >= 60) {
    footerHTML = `🌟 ${done}/${total} 已完成 (${pct}%)<br><span style="font-size:11px;color:#FBBC04">还有 ${total-done} 位小朋友在努力，马上就能集齐啦！💪</span>`;
  } else {
    footerHTML = `📢 ${done}/${total} 已完成<br><span style="font-size:11px;color:#5f6368">复述视频作业，越练越棒！爸爸妈妈一起加油~</span>`;
  }

  const preview = document.getElementById('cardPreview');
  preview.innerHTML = `
    <div style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
      <div class="card-header">
        <div class="hw-badge">📹 复述视频作业</div>
        <div class="card-title">${cls.name} · 完成追踪</div>
        <div class="card-week">${range.label}</div>
      </div>
      <div class="card-divider"></div>
      ${blocksHTML}
      <div class="card-footer">
        ${footerHTML}
        <div style="font-size:11px;color:#999;margin-top:6px">📤 可以提交到群里或者APP</div>
      </div>
    </div>
  `;

  showToast('正在生成卡片...');

  if (typeof html2canvas === 'undefined') {
    await new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }

  try {
    const canvas = await html2canvas(preview, {
      backgroundColor: '#ffffff',
      scale: 2,
      useCORS: true,
    });
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${cls.name}_复述视频作业_${currentWeek}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('卡片已下载！✅');
    }, 'image/png');
  } catch (e) {
    showToast('生成失败，请重试');
    console.error(e);
  }
}

// ========== TOAST ==========
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ========== INIT ==========
render();
</script>
</body>
</html>
